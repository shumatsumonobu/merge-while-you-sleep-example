# 下書き用の Issue のテンプレート。.github/ISSUE_TEMPLATE/merge-while-you-sleep-draft.yml にコピーする
# 下書きラベルを自動で付ける。ラベルの名前を変数 MERGE_WHILE_YOU_SLEEP_DRAFT_LABEL で変えたら、labels も同じ名前に修正する
name: やりたいことを書く
description: やりたいことを書くと、Claude Code が完了条件の案と質問をコメントします。案でよければ、起動ラベルを付けて承認してください
labels: ["merge-while-you-sleep: draft"]
body:
  - type: textarea
    id: request
    attributes:
      label: やりたいこと
      description: 何を変えたいか、なぜ変えたいかを書いてください。分かっていれば、困っている場面や期待する結果も書いてください
    validations:
      required: true
